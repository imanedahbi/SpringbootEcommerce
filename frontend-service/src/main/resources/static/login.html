<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Beauty Hair</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-background"></div>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="login-card card p-5 shadow-lg">
                    <div class="text-center mb-4">
                        <div class="login-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <h3 class="login-title">Connexion</h3>
                        <p class="login-subtitle">Accédez à votre espace personnel</p>
                    </div>

                    <div id="globalMessage"></div>

                    <form id="loginForm" novalidate>
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" id="email" class="form-control" placeholder="Votre adresse email" required>
                            </div>
                            <div class="invalid-feedback" id="emailError"></div>
                        </div>
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" id="password" class="form-control" placeholder="Votre mot de passe" required>
                            </div>
                            <div class="invalid-feedback" id="passwordError"></div>
                        </div>
                        <button type="submit" class="btn btn-login w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="register-text">
                            Pas encore inscrit ?
                            <a href="http://localhost:8080/frontend/signup.html" class="register-link">Créer un compte</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('loginForm');
    const globalMessage = document.getElementById('globalMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Réinitialiser les messages d'erreur
        ['email','password'].forEach(id => {
            document.getElementById(id).classList.remove('is-invalid','is-valid');
            document.getElementById(id+'Error').innerText='';
        });
        globalMessage.innerHTML='';
        globalMessage.className='';

        const payload = {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/users/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(payload)
            });

            const data = await response.json(); // parser le JSON

            console.log(data);

            if(response.ok){
                console.log("Données reçues après login :", data);

                localStorage.setItem('userId', data.userId);
                localStorage.setItem('userEmail', data.userEmail);

                // 👉 👉 👉 AJOUTE CETTE LIGNE ICI EXACTEMENT
                localStorage.setItem('role', data.role);
                console.log("Role reçu après login :", data.role);


                ['email','password'].forEach(id => document.getElementById(id).classList.add('is-valid'));
                globalMessage.className='alert alert-success text-center';
                globalMessage.innerText='Connexion réussie ! Redirection...';

                setTimeout(() => {
                    window.location.href = "http://localhost:8080/frontend/home.html";
                }, 1000);

            } else {
                // gérer les erreurs
                if(data.message.toLowerCase().includes('email')){
                    document.getElementById('email').classList.add('is-invalid');
                    document.getElementById('emailError').innerText=data.message;
                } else if(data.message.toLowerCase().includes('mot de passe')){
                    document.getElementById('password').classList.add('is-invalid');
                    document.getElementById('passwordError').innerText=data.message;
                } else {
                    globalMessage.className='alert alert-danger text-center';
                    globalMessage.innerText=data.message;
                }
            }
        } catch(err){
            globalMessage.className='alert alert-danger text-center';
            globalMessage.innerText='Erreur serveur. Veuillez réessayer.';
            console.error(err);
        }

    });
</script>
</body>
</html>

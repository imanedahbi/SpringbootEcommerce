<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Livraison</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/product.css">
</head>

<div id="navbar-container"></div>

<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4 text-center">Informations pour la livraison</h1>

    <div class="row mb-4">
        <div class="col-md-8 offset-md-2">
            <div class="card p-3 shadow-sm">
                <h5 class="card-title text-center">Créer une livraison</h5>

                <div id="order-products" class="mb-3"></div>

                <form id="delivery-form">
                    <input type="hidden" id="orderIdInput"> <!-- caché -->

                    <div class="mb-3">
                        <label for="firstNameInput" class="form-label">Prénom</label>
                        <input type="text" class="form-control" id="firstNameInput" required>
                    </div>
                    <div class="mb-3">
                        <label for="lastNameInput" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="lastNameInput" required>
                    </div>
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Email</label>
                        <input type="email" class="form-control" id="emailInput" required>
                    </div>
                    <div class="mb-3">
                        <label for="phoneInput" class="form-label">Téléphone</label>
                        <input type="text" class="form-control" id="phoneInput" required>
                    </div>
                    <div class="mb-3">
                        <label for="addressInput" class="form-label">Adresse de livraison</label>
                        <input type="text" class="form-control" id="addressInput" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Créer Livraison</button>
                </form>

                <div id="form-message" class="mt-2 text-center"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const DELIVERY_API = "http://localhost:8085/deliveries";

    const ORDER_API = "http://localhost:8080/orders";

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    console.log("orderId depuis URL:", orderId); // ✅ debug
    document.getElementById("orderIdInput").value = orderId; // caché

    async function loadOrder() {
        if (!orderId) return;

        try {
            const res = await fetch(`${ORDER_API}/${orderId}`);
            if (!res.ok) throw new Error(await res.text());
            const order = await res.json();

            // Affichage des produits
            const productsHtml = order.items.map(item => `
                <p><strong>Produit:</strong> ${item.productName} | <strong>Quantité:</strong> ${item.quantity} | <strong>Prix:</strong> ${item.price}</p>
            `).join('');

            document.getElementById("order-products").innerHTML = `<h6>Produits commandés :</h6>${productsHtml}`;

        } catch(err) {
            console.error(err);
            document.getElementById("order-products").innerHTML = `<div class="alert alert-danger">Impossible de récupérer la commande.</div>`;
        }
    }

    document.getElementById("delivery-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const orderIdValue = document.getElementById("orderIdInput").value;

        // 1️⃣ Récupérer userId
        const userId = parseInt(localStorage.getItem("userId"));
        if (!userId) {
            document.getElementById("form-message").innerHTML =
                `<div class="alert alert-danger">Utilisateur non connecté.</div>`;
            return;
        }

        try {
            // 2️⃣ Créer livraison
            const payload = {
                orderId: orderIdValue,
                firstName: document.getElementById("firstNameInput").value,
                lastName: document.getElementById("lastNameInput").value,
                email: document.getElementById("emailInput").value,
                phone: document.getElementById("phoneInput").value,
                address: document.getElementById("addressInput").value
            };

            const res = await fetch(`${DELIVERY_API}/create`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(await res.text());

            // 3️⃣ Confirmer livraison
            const confirmRes = await fetch(
                `${ORDER_API}/confirm-delivery?orderId=${orderIdValue}&userId=${userId}`,
                { method: "POST" }
            );
            if (!confirmRes.ok) throw new Error(await confirmRes.text());

            // 4️⃣ Vider le panier côté serveur
            //const clearRes = await fetch(`http://localhost:8084/cart/clear/${userId}`, { method: "DELETE" });
            //if (!clearRes.ok) throw new Error(await clearRes.text());

            // 5️⃣ Vider localStorage
                        localStorage.removeItem("cart");

            // 6️⃣ Redirection
                        window.location.href = "cart.html";


        } catch (err) {
            console.error(err);
            document.getElementById("form-message").innerHTML =
                `<div class="alert alert-danger">Erreur lors de la création de la livraison.</div>`;
        }
    });



    // Navbar
    fetch('navbar.html').then(res => res.text()).then(data => document.getElementById('navbar-container').innerHTML = data);

    document.addEventListener("DOMContentLoaded", loadOrder);
</script>
</body>
</html>

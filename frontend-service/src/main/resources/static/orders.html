<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/navbar.css">
</head>
<body>

<!-- Inclusion de la navbar -->
<div id="navbar-container"></div>

<div class="container my-5">
    <h2 class="mb-4">Mes Commandes</h2>

    <!-- Table des commandes -->
    <table class="table table-striped" id="orders-table">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Utilisateur</th>
            <th>Total (€)</th>
            <th>Statut</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Les commandes seront insérées ici via JavaScript -->
        </tbody>
    </table>
</div>

<!-- Modal pour afficher détails de la commande -->
<div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="orderModalLabel">Détails de la commande</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>
            <div class="modal-body">
                <table class="table">
                    <thead class="table-light">
                    <tr>
                        <th>Produit ID</th>
                        <th>Quantité</th>
                        <th>Prix (€)</th>
                        <th>Sous-total (€)</th>
                    </tr>
                    </thead>
                    <tbody id="order-items-body">
                    <!-- Items de la commande -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS & Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script pour charger la navbar et les commandes -->
<script>
    // Charger la navbar
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => document.getElementById('navbar-placeholder').innerHTML = data);

    // Exemple de récupération des commandes (à remplacer par ton API)
    async function loadOrders() {
        const tbody = document.querySelector("#orders-table tbody");
        tbody.innerHTML = '';

        try {
            const response = await fetch("http://localhost:8080/orders"); // endpoint API Gateway
            const orders = await response.json();

            orders.forEach(order => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                        <td>${order.id}</td>
                        <td>${order.userId || order.userEmail}</td>
                        <td>${order.totalAmount.toFixed(2)}</td>
                        <td>${order.status}</td>
                        <td>${new Date(order.createdAt).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="showOrderDetails(${order.id})">Détails</button>
                        </td>
                    `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Erreur lors du chargement des commandes :", error);
        }
    }

    async function showOrderDetails(orderId) {
        const tbody = document.getElementById("order-items-body");
        tbody.innerHTML = '';

        try {
            const response = await fetch(`http://localhost:8080/orders/${orderId}`); // endpoint API Gateway
            const order = await response.json();

            order.items.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                        <td>${item.productId}</td>
                        <td>${item.quantity}</td>
                        <td>${item.price.toFixed(2)}</td>
                        <td>${item.subtotal.toFixed(2)}</td>
                    `;
                tbody.appendChild(tr);
            });

            // Afficher le modal
            const modal = new bootstrap.Modal(document.getElementById('orderModal'));
            modal.show();

        } catch (error) {
            console.error("Erreur lors du chargement des détails :", error);
        }
    }

    // Charger les commandes au chargement de la page
    window.onload = loadOrders;
</script>

</body>
</html>

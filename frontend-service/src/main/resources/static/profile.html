<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<!-- Inclusion de la navbar -->
<div id="navbar-container"></div>

<script>
    // Charger la navbar depuis un fichier externe
    fetch('/frontend/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar').innerHTML = data;
        })
        .catch(err => console.error('Erreur chargement navbar:', err));
</script>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">Mon Profil</h3>
        <div class="mb-3">
            <label class="form-label">Nom :</label>
            <input type="text" id="name" class="form-control" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Email :</label>
            <input type="email" id="email" class="form-control" readonly>
        </div>
        <div class="mb-3 text-center">
            <button class="btn btn-primary" id="editProfileBtn" onclick="window.location.href='edit-profile.html'">Modifier le Profil</button>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const email = localStorage.getItem('userEmail'); // email stocké lors du login

        if(!email){
            alert('Utilisateur non connecté');
            window.location.href = '/frontend/login.html';
            return;
        }

        try {
            const response = await fetch(`/users/${email}`);
            if(response.ok){
                const user = await response.json();
                document.getElementById('name').value = user.name;
                document.getElementById('email').value = user.email;
            } else {
                console.error('Impossible de récupérer les informations de l’utilisateur');
            }
        } catch(err){
            console.error('Erreur:', err);
        }
    });

    // Gestion du bouton modifier
    const editBtn = document.getElementById('editProfileBtn');
    editBtn.addEventListener('click', () => {
        // Rendre les champs modifiables
        document.getElementById('name').readOnly = false;
        document.getElementById('email').readOnly = false;
        editBtn.innerText = 'Enregistrer';

        editBtn.onclick = async () => {
            const updatedUser = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value
            };

            try {
                const response = await fetch(`/users/${localStorage.getItem('userEmail')}`, {
                    method: 'PUT',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(updatedUser)
                });

                if(response.ok){
                    alert('Profil mis à jour !');
                    localStorage.setItem('userEmail', updatedUser.email); // mettre à jour l'email stocké
                    window.location.reload();
                } else {
                    alert('Erreur lors de la mise à jour');
                }
            } catch(err){
                console.error(err);
            }
        }
    });
</script>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script pour charger la navbar -->
<script>
    // Charger la navbar
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-container').innerHTML = data;
        })
        .catch(error => console.error('Erreur lors du chargement de la navbar:', error));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier le Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/edit-profile.css">
</head>
<body>

<!-- Inclusion de la navbar -->
<div id="navbar-container"></div>

<script>
    // Charger la navbar
    fetch('/frontend/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar').innerHTML = data;
        })
        .catch(err => console.error('Erreur chargement navbar:', err));
</script>

<div class="container mt-5">
    <!-- Message d'alerte (caché par défaut) -->
    <div id="alertMessage" class="alert d-none"></div>

    <div class="card shadow p-4">
        <h3 class="text-center mb-4">
            <i class="fas fa-user-edit me-2"></i>Modifier le Profil
        </h3>

        <!-- Informations actuelles -->
        <div class="current-info mb-4 p-3 rounded" style="background: linear-gradient(135deg, #f0f9ff, #e0f2fe); border-left: 4px solid #38bdf8;">
            <h5 class="mb-3"><i class="fas fa-info-circle me-2"></i>Informations actuelles</h5>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-2">
                        <strong>Nom :</strong> <span id="currentName" class="ms-2">Chargement...</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-2">
                        <strong>Email :</strong> <span id="currentEmail" class="ms-2">Chargement...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulaire d'édition -->
        <form id="editForm">
            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-user me-2"></i>Nom :
                </label>
                <input type="text" id="name" class="form-control" required
                       placeholder="Votre nom complet">
                <div class="validation-message" id="nameValidation"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-envelope me-2"></i>Email :
                </label>
                <input type="email" id="email" class="form-control" required
                       placeholder="votre.email@exemple.com">
                <div class="validation-message" id="emailValidation"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-lock me-2"></i>Mot de passe :
                </label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control"
                           placeholder="Laisser vide pour ne pas changer"
                           pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-hint mt-2">
                    <i class="fas fa-lightbulb me-2"></i>
                    Minimum 8 caractères avec au moins une lettre et un chiffre
                </div>
                <div class="validation-message" id="passwordValidation"></div>
            </div>

            <!-- Aperçu des modifications -->
            <div class="preview-section mb-4">
                <h5><i class="fas fa-eye me-2"></i>Aperçu des modifications</h5>
                <div class="preview-info">
                    <div class="preview-item">
                        <div class="preview-label">Nom</div>
                        <div class="preview-value" id="preview-name">Aucune modification</div>
                    </div>
                    <div class="preview-item">
                        <div class="preview-label">Email</div>
                        <div class="preview-value" id="preview-email">Aucune modification</div>
                    </div>
                    <div class="preview-item">
                        <div class="preview-label">Mot de passe</div>
                        <div class="preview-value" id="preview-password">Non modifié</div>
                    </div>
                </div>
            </div>

            <!-- Boutons d'action -->
            <div class="button-container">
                <button type="button" class="btn btn-primary" id="saveBtn">
                    <i class="fas fa-save me-2"></i>Enregistrer les modifications
                </button>
                <a href="profile.html" class="btn btn-secondary">
                    <i class="fas fa-times me-2"></i>Annuler
                </a>
                <button type="button" class="btn btn-outline-danger" id="resetBtn">
                    <i class="fas fa-redo me-2"></i>Réinitialiser
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const email = localStorage.getItem('userEmail');
        if (!email) {
            showAlert('Utilisateur non connecté', 'error');
            setTimeout(() => {
                window.location.href = '/frontend/login.html';
            }, 2000);
            return;
        }

        let originalUser = null;

        // Charger les infos actuelles
        try {
            const response = await fetch(`/users/${email}`);
            if (response.ok) {
                originalUser = await response.json();

                // Afficher les infos actuelles
                document.getElementById('currentName').textContent = originalUser.name;
                document.getElementById('currentEmail').textContent = originalUser.email;

                // Remplir le formulaire
                document.getElementById('name').value = originalUser.name;
                document.getElementById('email').value = originalUser.email;

                // Mettre à jour l'aperçu
                updatePreview();

            } else {
                showAlert('Impossible de charger le profil', 'error');
            }
        } catch (err) {
            console.error(err);
            showAlert('Erreur de connexion au serveur', 'error');
        }

        // Fonction pour afficher les alertes
        function showAlert(message, type = 'info') {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type === 'error' ? 'error' : type === 'success' ? 'success' : 'info'} d-block`;
            alertDiv.innerHTML = `
                <i class="fas fa-${type === 'error' ? 'exclamation-triangle' : type === 'success' ? 'check-circle' : 'info-circle'} me-2"></i>
                ${message}
                <button type="button" class="btn-close float-end" onclick="this.parentElement.classList.add('d-none')"></button>
            `;

            // Masquer automatiquement après 5 secondes pour les succès
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.classList.add('d-none');
                }, 5000);
            }
        }

        // Fonction pour mettre à jour l'aperçu
        function updatePreview() {
            if (!originalUser) return;

            const newName = document.getElementById('name').value;
            const newEmail = document.getElementById('email').value;
            const newPassword = document.getElementById('password').value;

            // Aperçu du nom
            const namePreview = document.getElementById('preview-name');
            if (newName !== originalUser.name) {
                namePreview.innerHTML = `
                    <span class="text-decoration-line-through me-2">${originalUser.name}</span>
                    <i class="fas fa-arrow-right text-primary me-2"></i>
                    <span class="fw-bold text-primary">${newName}</span>
                `;
                namePreview.parentElement.classList.add('field-changed');
            } else {
                namePreview.textContent = 'Aucune modification';
                namePreview.parentElement.classList.remove('field-changed');
            }

            // Aperçu de l'email
            const emailPreview = document.getElementById('preview-email');
            if (newEmail !== originalUser.email) {
                emailPreview.innerHTML = `
                    <span class="text-decoration-line-through me-2">${originalUser.email}</span>
                    <i class="fas fa-arrow-right text-primary me-2"></i>
                    <span class="fw-bold text-primary">${newEmail}</span>
                `;
                emailPreview.parentElement.classList.add('field-changed');
            } else {
                emailPreview.textContent = 'Aucune modification';
                emailPreview.parentElement.classList.remove('field-changed');
            }

            // Aperçu du mot de passe
            const passwordPreview = document.getElementById('preview-password');
            if (newPassword) {
                passwordPreview.innerHTML = `
                    <span class="text-success">
                        <i class="fas fa-check-circle me-1"></i>Seras modifié
                    </span>
                `;
                passwordPreview.parentElement.classList.add('field-changed');
            } else {
                passwordPreview.textContent = 'Non modifié';
                passwordPreview.parentElement.classList.remove('field-changed');
            }
        }

        // Validation en temps réel
        function validateField(field, value) {
            const validationDiv = document.getElementById(field.id + 'Validation');

            if (!value.trim()) {
                validationDiv.className = 'validation-message invalid';
                validationDiv.innerHTML = '<i class="fas fa-exclamation-circle me-1"></i>Ce champ est requis';
                return false;
            }

            if (field.id === 'email') {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(value)) {
                    validationDiv.className = 'validation-message invalid';
                    validationDiv.innerHTML = '<i class="fas fa-exclamation-circle me-1"></i>Adresse email invalide';
                    return false;
                }
            }

            if (field.id === 'password' && value) {
                const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$/;
                if (!passwordRegex.test(value)) {
                    validationDiv.className = 'validation-message invalid';
                    validationDiv.innerHTML = '<i class="fas fa-exclamation-circle me-1"></i>Format invalide (min. 8 caractères avec lettres et chiffres)';
                    return false;
                }
            }

            validationDiv.className = 'validation-message valid';
            validationDiv.innerHTML = '<i class="fas fa-check-circle me-1"></i>Valide';
            return true;
        }

        // Écouteurs d'événements pour la validation en temps réel
        document.getElementById('name').addEventListener('input', function(e) {
            validateField(this, e.target.value);
            updatePreview();
            this.classList.add('changed');
        });

        document.getElementById('email').addEventListener('input', function(e) {
            validateField(this, e.target.value);
            updatePreview();
            this.classList.add('changed');
        });

        document.getElementById('password').addEventListener('input', function(e) {
            validateField(this, e.target.value);
            updatePreview();
            this.classList.add('changed');
        });

        // Toggle visibilité du mot de passe
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
                this.setAttribute('title', 'Cacher le mot de passe');
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye';
                this.setAttribute('title', 'Afficher le mot de passe');
            }
        });

        // Réinitialiser le formulaire
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (confirm('Voulez-vous vraiment réinitialiser toutes les modifications ?')) {
                if (originalUser) {
                    document.getElementById('name').value = originalUser.name;
                    document.getElementById('email').value = originalUser.email;
                    document.getElementById('password').value = '';

                    // Réinitialiser les validations
                    ['name', 'email', 'password'].forEach(id => {
                        document.getElementById(id + 'Validation').className = 'validation-message';
                        document.getElementById(id).classList.remove('changed');
                    });

                    updatePreview();
                    showAlert('Formulaire réinitialisé', 'info');
                }
            }
        });

        // Sauvegarder les modifications
        document.getElementById('saveBtn').addEventListener('click', async function() {
            // Validation avant envoi
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!name || !email) {
                showAlert('Veuillez remplir tous les champs obligatoires', 'error');
                return;
            }

            // Valider l'email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('Adresse email invalide', 'error');
                return;
            }

            // Valider le mot de passe s'il est renseigné
            if (password) {
                const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$/;
                if (!passwordRegex.test(password)) {
                    showAlert('Le mot de passe doit contenir au moins 8 caractères avec lettres et chiffres', 'error');
                    return;
                }
            }

            // Afficher l'indicateur de chargement
            this.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Enregistrement...';
            this.classList.add('loading');
            this.disabled = true;

            const updatedUser = {
                name: name,
                email: email,
                password: password || null
            };

            try {
                const response = await fetch(`/users/${originalUser.email}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(updatedUser)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Profil mis à jour avec succès ! ✅', 'success');

                    // Mettre à jour l'email dans le localStorage
                    localStorage.setItem('userEmail', updatedUser.email);

                    // Rediriger vers le profil après 2 secondes
                    setTimeout(() => {
                        window.location.href = '/frontend/profile.html';
                    }, 2000);

                } else {
                    showAlert(data.message || 'Erreur lors de la mise à jour ❌', 'error');

                    // Réactiver le bouton
                    this.innerHTML = '<i class="fas fa-save me-2"></i>Enregistrer les modifications';
                    this.classList.remove('loading');
                    this.disabled = false;
                }
            } catch (err) {
                console.error('Erreur:', err);
                showAlert('Erreur serveur. Veuillez réessayer.', 'error');

                // Réactiver le bouton
                this.innerHTML = '<i class="fas fa-save me-2"></i>Enregistrer les modifications';
                this.classList.remove('loading');
                this.disabled = false;
            }
        });
    });
</script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script pour charger la navbar -->
<script>
    // Charger la navbar
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-container').innerHTML = data;
        })
        .catch(error => console.error('Erreur lors du chargement de la navbar:', error));
</script>
</body>
</html>

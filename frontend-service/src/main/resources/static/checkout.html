<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passer une commande</title>
    <link rel="stylesheet" href="css/navbar.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<div class="container my-5">
    <h2 class="mb-4">Passer une commande</h2>

    <!-- Formulaire pour l'email et les produits -->
    <form id="order-form">
        <div class="mb-3">
            <label for="userEmail" class="form-label">Email de l'utilisateur</label>
            <input type="email" class="form-control" id="userEmail" placeholder="exemple@email.com" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Produits</label>
            <div id="products-container">
                <!-- Les produits seront ajoutés ici dynamiquement -->
            </div>
            <button type="button" class="btn btn-sm btn-success mt-2" onclick="addProductRow()">Ajouter un produit</button>
        </div>

        <button type="submit" class="btn btn-primary">Commander</button>
    </form>

    <div id="result" class="mt-4"></div>
</div>

<!-- Bootstrap JS & Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Charger la navbar
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => document.getElementById('navbar-placeholder').innerHTML = data);

    // Ajouter une ligne pour un produit
    function addProductRow() {
        const container = document.getElementById("products-container");
        const index = container.children.length;

        const div = document.createElement("div");
        div.classList.add("row", "mb-2");
        div.innerHTML = `
                <div class="col-6">
                    <input type="number" class="form-control" placeholder="ID du produit" name="productId" required>
                </div>
                <div class="col-4">
                    <input type="number" class="form-control" placeholder="Quantité" name="quantity" min="1" value="1" required>
                </div>
                <div class="col-2">
                    <button type="button" class="btn btn-danger" onclick="div.remove()">Supprimer</button>
                </div>
            `;
        container.appendChild(div);
    }

    // Soumission du formulaire
    document.getElementById("order-form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const userEmail = document.getElementById("userEmail").value;
        const productRows = document.querySelectorAll("#products-container .row");
        const items = [];

        productRows.forEach(row => {
            const productId = row.querySelector('input[name="productId"]').value;
            const quantity = row.querySelector('input[name="quantity"]').value;
            if(productId && quantity) {
                items.push({ productId: Number(productId), quantity: Number(quantity) });
            }
        });

        const orderData = { userEmail, items };

        try {
            const response = await fetch("http://localhost:8080/orders/create", { // API Gateway
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orderData)
            });

            const result = await response.json();

            if(response.ok) {
                document.getElementById("result").innerHTML = `<div class="alert alert-success">Commande créée avec succès ! ID: ${result.id}</div>`;
                // vider formulaire
                document.getElementById("order-form").reset();
                document.getElementById("products-container").innerHTML = '';
            } else {
                document.getElementById("result").innerHTML = `<div class="alert alert-danger">Erreur : ${result}</div>`;
            }

        } catch (error) {
            document.getElementById("result").innerHTML = `<div class="alert alert-danger">Erreur : ${error}</div>`;
        }
    });

    // Ajouter une première ligne de produit par défaut
    addProductRow();
</script>

</body>
</html>

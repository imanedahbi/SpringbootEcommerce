<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Panier </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/product.css">
</head>

<!-- Inclusion de la navbar -->
<div id="navbar-container"></div>

<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4 text-center">Mon Panier</h1>

    <!-- Liste panier -->
    <div id="cart-list" class="row gy-3"></div>

    <div class="mt-4 text-end">
        <h4>Total : <span id="cart-total">0.00</span> DH</h4>
        <button class="btn btn-success" id="checkoutBtn">Passer la commande</button>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS personnalisé -->
<script>
    const CART_API = "http://localhost:8084/cart"; // CartService
    const ORDER_API = "http://localhost:8084/orders"; // OrderService
    const PRODUCTS_API = "http://localhost:8083/products"; // ProductService
    const userId = Number(localStorage.getItem("userId")) || null;

    // ==== AJOUTEZ CES LIGNES ====
    if (!userId) {
        console.error("❌ ERREUR: Vous devez être connecté !");
        alert("Vous devez vous connecter pour voir votre panier.");
        window.location.href = "login.html";
        throw new Error("User not logged in"); // Arrête l'exécution
    }
    // ============================


    // Panier local
    let cartItems = [];
    let products = [];

    /* ---------- Charger les produits ---------- */
    async function loadProducts() {
        try {
            const res = await fetch(PRODUCTS_API);
            if (!res.ok) throw new Error(await res.text());
            products = await res.json();

            console.log("Produits retournés par le backend : ", products);
        } catch(err) {
            console.error("Erreur chargement produits :", err);
        }
    }


    console.log("👤 userId valide:", userId, "(type:", typeof userId, ")");
    /* ---------- Charger le panier ---------- */
    async function loadCart() {
        try {
            const res = await fetch(`${CART_API}/${userId}?t=${Date.now()}`);
            if (!res.ok) throw new Error(await res.text());

            cartItems = await res.json();
            console.log("🛒 Cart items reçus:", cartItems);

            renderCart();
        } catch(err) {
            console.error("❌ Erreur chargement panier :", err);
            cartItems = [];
            renderCart();
        }
    }



    /* ---------- Afficher le panier ---------- */
    function renderCart() {
        const container = document.getElementById("cart-list");
        container.innerHTML = "";
        let total = 0;

        if (cartItems.length === 0) {
            container.innerHTML = `<div class="col-12"><div class="alert alert-info">Votre panier est vide</div></div>`;
            document.getElementById("cart-total").innerText = "0.00";
            return;
        }

        cartItems.forEach(item => {
            const product = products.find(p => p.id === item.productId);
            if (!product) return;

            const subtotal = (product.price * item.quantity).toFixed(2);
            total += parseFloat(subtotal);

            const imgSrc = product.image ? `http://localhost:8083${product.image}` : "https://via.placeholder.com/150";

            const col = document.createElement("div");
            col.className = "col-12";
            col.innerHTML = `
            <div class="card mb-2 shadow-sm">
                <div class="row g-0 align-items-center">
                    <div class="col-md-2">
                        <img src="${imgSrc}" class="img-fluid rounded-start" alt="${product.name}">
                    </div>
                    <div class="col-md-6">
                        <div class="card-body">
                            <h5 class="card-title">${product.name}</h5>
                            <p class="card-text">${product.description || ""}</p>
                            <p class="mb-0"><strong>${product.price.toFixed(2)} DH</strong></p>
                        </div>
                    </div>
                    <div class="col-md-2 text-center">
                        <input type="number" min="1" value="${item.quantity}" class="form-control quantity-input" data-id="${item.id}">
                    </div>
                    <div class="col-md-2 text-center">
                        <p class="mb-1"><strong>Subtotal: ${subtotal} DH</strong></p>
                        <button class="btn btn-sm btn-danger delete-btn" data-id="${item.id}">Supprimer</button>
                    </div>
                </div>
            </div>
        `;
            container.appendChild(col);
        });

        document.getElementById("cart-total").innerText = total.toFixed(2);

        // Gestion modification quantité
        document.querySelectorAll(".quantity-input").forEach(input => {
            input.addEventListener("change", async (e) => {
                const id = e.target.dataset.id;
                const qty = parseInt(e.target.value);
                await updateCartItem(id, qty);
            });
        });

        // Gestion suppression
        document.querySelectorAll(".delete-btn").forEach(btn => {
            btn.addEventListener("click", async (e) => {
                const id = e.target.dataset.id;
                await deleteCartItem(id);
            });
        });
    }

    /* ---------- Mettre à jour quantité ---------- */
    async function updateCartItem(id, quantity) {
        try {
            await fetch(`${CART_API}/update/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ quantity })
            });

            // Recharge le panier depuis la BD (important)
            await loadCart();

        } catch(err) {
            console.error(err);
        }
    }








    /* ---------- Supprimer article ---------- */
    async function deleteCartItem(id) {
        try {
            await fetch(`${CART_API}/delete/${id}`, { method: "DELETE" });
            await loadCart();
        } catch(err) {
            console.error(err);
        }
    }

    /* ---------- Passer commande ---------- */
    document.getElementById("checkoutBtn").addEventListener("click", async () => {
        if (!userId) { alert("Vous devez être connecté."); return; }
        if (cartItems.length === 0) { alert("Votre panier est vide !"); return; }

        const orderRequest = {
            userId: userId,
            items: cartItems.map(item => ({ productId: item.productId, quantity: item.quantity }))
        };

        try {
            const res = await fetch(`${ORDER_API}/create`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orderRequest)
            });

            if (!res.ok) throw new Error(await res.text());
            const createdOrder = await res.json();

            // redirection vers livraison (on conserve userId en localStorage pour l'étape suivante)
            window.location.href = "delivery.html?orderId=" + createdOrder.id;

        } catch(err) {
            console.error(err);
            alert("Erreur lors de la commande : " + err.message);
        }
    });



    /* ---------- Initialisation ---------- */
    /* ---------- Initialisation ---------- */
    document.addEventListener("DOMContentLoaded", async () => {
        // Vérifier que userId est présent
        const storedUserId = localStorage.getItem("userId");
        if (!storedUserId) {
            alert("Vous devez être connecté pour voir le panier.");
            window.location.href = "login.html";
            return;
        }

        // Charger produits avant le panier pour que le rendu fonctionne
        await loadProducts();  // 1️⃣ d'abord produits
        await loadCart();      // 2️⃣ ensuite panier
    });





</script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script pour charger la navbar -->
<script>
    // Charger la navbar
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-container').innerHTML = data;
        })
        .catch(error => console.error('Erreur lors du chargement de la navbar:', error));
</script>
</body>
</html>

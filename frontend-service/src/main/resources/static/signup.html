<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - Beauty Hair</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
<div class="signup-container">
    <div class="signup-background"></div>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="signup-card card p-5 shadow-lg">
                    <div class="text-center mb-4">
                        <div class="signup-icon">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h3 class="signup-title">Inscription</h3>
                        <p class="signup-subtitle">Rejoignez la communauté Beauty Hair</p>
                    </div>

                    <div id="globalMessage"></div>

                    <form id="signupForm" novalidate>
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" id="name" class="form-control" placeholder="Votre nom complet" required>
                            </div>
                            <div class="invalid-feedback" id="nameError"></div>
                        </div>
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" id="email" class="form-control" placeholder="Votre adresse email" required>
                            </div>
                            <div class="invalid-feedback" id="emailError"></div>
                        </div>
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" id="password" class="form-control" placeholder="Votre mot de passe" required>
                            </div>
                            <div class="invalid-feedback" id="passwordError"></div>
                        </div>
                        <button type="submit" class="btn btn-signup w-100">
                            <i class="fas fa-user-plus me-2"></i>Créer mon compte
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="login-text">
                            Déjà inscrit ?
                            <a href="http://localhost:8080/frontend/login.html" class="login-link">Connectez-vous</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('signupForm');
    const globalMessage = document.getElementById('globalMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        ['name','email','password'].forEach(id => {
            document.getElementById(id).classList.remove('is-invalid','is-valid');
            document.getElementById(id+'Error').innerText='';
        });
        globalMessage.innerHTML='';
        globalMessage.className='';

        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            // 🔹 On ajoute /users via le gateway
            const response = await fetch('/users/register', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if(response.ok){
                ['name','email','password'].forEach(id => document.getElementById(id).classList.add('is-valid'));
                globalMessage.className='alert alert-success text-center';
                globalMessage.innerText='Inscription réussie ! Redirection vers connexion...';
                setTimeout(() => window.location.href='/frontend/login.html', 1000);
            } else {
                if(data.message){
                    globalMessage.className='alert alert-danger text-center';
                    globalMessage.innerText=data.message;
                }
                if(data.errors){
                    for(const field in data.errors){
                        const input = document.getElementById(field);
                        const errorDiv = document.getElementById(field+'Error');
                        input.classList.add('is-invalid');
                        errorDiv.innerText=data.errors[field];
                    }
                }
            }
        } catch(err){
            globalMessage.className='alert alert-danger text-center';
            globalMessage.innerText='Erreur serveur. Veuillez réessayer.';
            console.error(err);
        }
    });
</script>
</body>
</html>
